<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inloggen – Harry HR · CloudSuite</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
      text-align: center;
    }

    .logo {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, #2d7dd2, #1a2e4a);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 22px; color: #fff;
      margin: 0 auto 20px;
      box-shadow: 0 4px 16px rgba(45,125,210,.35);
    }

    h1 { font-size: 22px; font-weight: 700; color: #1a2e4a; margin-bottom: 6px; }

    .subtitle {
      font-size: 13.5px; color: #64748b; line-height: 1.5; margin-bottom: 28px;
    }

    .divider {
      height: 1px; background: #e2e8f0; margin: 24px 0;
      position: relative;
    }
    .divider span {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: #fff; padding: 0 10px;
      font-size: 12px; color: #94a3b8;
    }

    .google-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14.5px; font-weight: 500; color: #1e293b;
      cursor: pointer; text-decoration: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .google-btn:hover {
      border-color: #94a3b8;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      background: #f8fafc;
    }

    .google-btn svg { flex-shrink: 0; }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px; color: #dc2626;
      margin-bottom: 20px;
      text-align: left;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px; color: #94a3b8; line-height: 1.6;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 99px; padding: 4px 12px;
      font-size: 12px; color: #2563eb; font-weight: 500;
      margin-bottom: 20px;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px; border-radius: 50%;
      background: #2d7dd2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">HH</div>
    <h1>Harry HR</h1>
    <p class="subtitle">Jouw persoonlijke HR-assistent<br>van CloudSuite IP BV</p>

    <div class="badge">Alleen voor CloudSuite medewerkers</div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <a href="/login/google" class="google-btn">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.7 2.2 30.2 0 24 0 14.6 0 6.6 5.4 2.5 13.3l7.9 6.1C12.3 13 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/>
        <path fill="#FBBC05" d="M10.4 28.6A14.6 14.6 0 019.5 24c0-1.6.3-3.1.9-4.6L2.5 13.3A24 24 0 000 24c0 3.8.9 7.4 2.5 10.7l7.9-6.1z"/>
        <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2.1 1.4-4.7 2.3-7.7 2.3-6.3 0-11.7-4.2-13.6-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Inloggen met Google
    </a>

    <div class="footer">
      Log in met je <strong>@cloudsuite.com</strong> Google-account.<br>
      Andere accounts worden niet toegelaten.
    </div>
  </div>
</body>
</html>
